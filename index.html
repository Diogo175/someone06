<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030603">
<title>Someone Hub</title>
<style>
/* Layout: one CRT terminal window centered on a dark green void. Title bar, scrolling log, live prompt line, status bar. Single committed phosphor look. */
:root{
  --g:#39ff7a; --gd:#1f9a55; --amb:#ffd23f; --red:#ff4d5e; --cy:#3ee8ff; --bg:#030603; --line:#145c33;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Roboto Mono',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100%;color:var(--g);font-family:var(--mono);font-size:clamp(13px,1.9vw,16px);line-height:1.55;
  background:radial-gradient(70% 60% at 50% 35%,#072410 0,#020402 100%);
  padding-block:18px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));overflow-x:hidden}
.win{position:relative;max-width:940px;margin:0 auto;min-height:calc(100vh - 40px);display:flex;flex-direction:column;overflow:hidden;
  border:1px solid var(--line);border-radius:12px;background:rgba(2,9,4,.9);box-shadow:0 0 80px rgba(57,255,122,.12),inset 0 0 90px rgba(0,0,0,.6);
  text-shadow:0 0 6px rgba(57,255,122,.5)}
.win::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
.win::before{content:"";position:absolute;left:0;right:0;top:-30%;height:30%;pointer-events:none;z-index:4;
  background:linear-gradient(180deg,transparent,rgba(57,255,122,.06),transparent);animation:roll 8s linear infinite}
@keyframes roll{to{top:110%}}

.tb{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);color:var(--gd);font-size:12px;position:relative;z-index:6}
.dots{display:flex;gap:7px}
.dots i{width:11px;height:11px;border-radius:50%;border:1px solid var(--g);display:block}
.dots i:first-child{cursor:pointer;border-color:var(--red);box-shadow:0 0 6px var(--red)}
.ttl{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snd{font:inherit;color:var(--gd);background:none;border:1px solid var(--line);border-radius:6px;padding:2px 8px;cursor:pointer;text-shadow:none}
.snd:hover,.snd:focus-visible{color:var(--g);border-color:var(--g);outline:none}

.term{flex:1;padding:18px 18px 8px;position:relative;z-index:3;cursor:text}
.ln{white-space:pre-wrap;word-break:break-word;min-height:1.55em;transition:opacity .5s,transform .5s}
.ln.gone{opacity:0;transform:translateX(30px)}
.dim{color:var(--gd)}.warn{color:var(--amb)}.bad{color:var(--red)}.cy{color:var(--cy)}.amb{color:var(--amb)}
.ln a{color:var(--cy);text-decoration:underline}
.echo{color:var(--g)}
.ps1{color:var(--cy)}
.banner{position:relative;font-weight:700;font-size:clamp(2.6rem,13vw,6.6rem);line-height:1.05;letter-spacing:-.04em;margin:10px 0 6px;color:var(--g);text-shadow:0 0 18px rgba(57,255,122,.6)}
.banner .us{animation:bl 1s steps(2) infinite}
.banner::before,.banner::after{content:attr(data-text);position:absolute;left:0;top:0;opacity:0;pointer-events:none;letter-spacing:-.04em}
.banner::before{color:#ff2d55;animation:gl 5s infinite}
.banner::after{color:#2de2ff;animation:gl 5s infinite .07s reverse}
@keyframes gl{0%,91%,100%{opacity:0;transform:none}92%{opacity:.85;transform:translate(-4px,1px);clip-path:inset(20% 0 55% 0)}94%{opacity:.85;transform:translate(4px,-1px);clip-path:inset(60% 0 8% 0)}96%{opacity:.85;transform:translate(-2px,0);clip-path:inset(38% 0 30% 0)}}
.lk{display:grid;grid-template-columns:4ch 11ch minmax(0,1fr);gap:0 1ch;cursor:pointer;padding:1px 4px;margin-inline:-4px;border-radius:4px}
.lk:hover{background:rgba(57,255,122,.1)}
.hdr{color:var(--g);font-weight:700;letter-spacing:.14em;margin-top:8px}
.hdr .dim{letter-spacing:0;font-weight:400}
#in::placeholder{color:var(--g);opacity:.5}
.prompt{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:1.08em}
.prompt .ps1{color:var(--g);font-weight:700}
.cur{flex:none;width:.62em;height:1.15em;background:var(--g);box-shadow:0 0 10px var(--g);animation:bl 1s steps(2) infinite}
.prompt:focus-within .cur{display:none}
.tbox{width:min(100%,440px);font-size:clamp(15px,4.6vw,20px);line-height:1.9;padding:14px;border:1px solid var(--line);border-radius:8px;background:rgba(57,255,122,.03);color:var(--gd)}
.tw.ok{color:var(--g)}.tw.bad{color:#ff4d5e;text-decoration:line-through}.tw.cur2{color:#fff;border-bottom:2px solid var(--g)}
.tin{width:min(100%,440px);font:inherit;font-size:18px;background:#020a04;color:var(--g);border:1px solid var(--g);border-radius:8px;padding:12px;outline:none;user-select:text;-webkit-user-select:text}
.lk .num{color:var(--amb);font-weight:700}
.lk .hd{color:var(--cy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prompt{display:flex;align-items:center;gap:1ch;margin-top:2px}
.prompt[hidden]{display:none}
.ps1{flex:none;white-space:nowrap}
#in{flex:1;min-width:6ch;background:transparent;border:0;outline:0;color:var(--g);font:inherit;text-shadow:inherit;caret-color:var(--g);caret-shape:block;padding:0}
.sb{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--line);color:var(--gd);font-size:12px;position:relative;z-index:6}
.pv{font:inherit;color:var(--gd);background:none;border:0;border-bottom:1px dotted var(--gd);padding:0;cursor:pointer;text-shadow:inherit}
.pv:hover,.pv:focus-visible{color:var(--g);border-color:var(--g);outline:none}

#mx{position:fixed;inset:0;width:100%;height:100%;z-index:25;pointer-events:none;opacity:0;transition:opacity .6s}
#mx.show{opacity:1}
.feed{position:fixed;inset:0;z-index:30;background:rgba(2,6,3,.82);padding:18px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;font-size:clamp(11px,1.8vw,14px);text-shadow:none}
.feed[hidden]{display:none}
.feed .fl{white-space:nowrap;overflow:hidden;text-overflow:clip}
.feed .big{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:700;font-size:clamp(2rem,10vw,6rem);color:var(--g);text-shadow:0 0 30px var(--g);background:rgba(2,6,3,.9);animation:flash .2s steps(2) infinite}
.hbar{position:absolute;left:18px;right:18px;top:18px;color:var(--red)}
.hbar b{display:block;height:10px;border:1px solid var(--red);margin-top:6px}
.hbar b i{display:block;height:100%;width:0;background:var(--red)}
body.hacking .win{animation:shake .12s steps(2) infinite}
body.hacking .ln,body.hacking .tb,body.hacking .sb,body.hacking .prompt{text-shadow:2px 0 #ff2d55,-2px 0 #2de2ff;transition:transform .08s}
body.hacking .banner{color:var(--red)}
@keyframes shake{0%{translate:0 0}50%{translate:-5px 3px}100%{translate:4px -2px}}
@keyframes flash{50%{color:var(--red);text-shadow:0 0 30px var(--red)}}
@keyframes bl{50%{opacity:0}}
.gh{font-weight:700;font-size:clamp(2.4rem,13vw,4.4rem);letter-spacing:-.04em;color:var(--g);text-shadow:0 0 18px rgba(57,255,122,.6)}
.gk{color:var(--gd);letter-spacing:.12em;text-transform:uppercase;font-size:12px;text-align:center;padding:0 16px}
.start{display:flex;align-items:center;gap:14px;font:inherit;font-size:clamp(14px,4.4vw,18px);font-weight:700;letter-spacing:.14em;color:#021006;background:var(--g);border:0;border-radius:14px;padding:18px 26px;cursor:pointer;box-shadow:0 0 34px rgba(57,255,122,.55);text-shadow:none;animation:pwr 2s ease-in-out infinite}
.start:hover,.start:focus-visible{background:#7dffa8;outline:none}
.start .tri{width:0;height:0;border-left:13px solid #021006;border-top:8px solid transparent;border-bottom:8px solid transparent}
.skip{font:inherit;font-size:12px;color:var(--gd);background:none;border:0;border-bottom:1px dotted var(--gd);padding:0;cursor:pointer;text-shadow:none}
.skip:hover,.skip:focus-visible{color:var(--g);border-color:var(--g);outline:none}
.snk{position:fixed;inset:0;z-index:35;background:#010602;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));touch-action:none;color:var(--g);font-size:13px;text-shadow:none;user-select:none;-webkit-user-select:none}
.snk .sh{display:flex;gap:16px;align-items:center;justify-content:space-between;width:min(100%,440px)}
.snk .sh b{letter-spacing:.2em}
.snk canvas{border:1px solid var(--line);border-radius:6px;box-shadow:0 0 30px rgba(57,255,122,.2);max-width:100%}
.snk .sg{color:var(--gd);font-size:12px;text-align:center}
.g{color:var(--g);font-weight:700}
.gate{position:absolute;inset:0;z-index:8;background:#010301;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;cursor:pointer;transition:opacity .3s;text-shadow:none}
.gate.out{opacity:0;pointer-events:none}
.gate .pw{position:relative;width:76px;height:76px;border-radius:50%;border:2px solid var(--g);box-shadow:0 0 24px rgba(57,255,122,.5),inset 0 0 18px rgba(57,255,122,.25);animation:pwr 2s ease-in-out infinite}
.gate .pw::before{content:"";position:absolute;left:50%;top:13px;width:3px;height:26px;margin-left:-1.5px;background:var(--g);box-shadow:0 0 8px var(--g);border-radius:2px}
.gate .gt{color:var(--g);letter-spacing:.14em;text-transform:uppercase;font-size:13px;text-align:center;padding:0 16px;animation:bl 1.2s steps(2) infinite}
.gate .gs{color:var(--gd);font-size:11px}
@keyframes pwr{50%{box-shadow:0 0 40px rgba(57,255,122,.8),inset 0 0 24px rgba(57,255,122,.4)}}
.win.crton{animation:crton .45s cubic-bezier(.2,.7,.2,1)}
@keyframes crton{0%{transform:scale(0,.004);filter:brightness(10)}30%{transform:scale(1,.004);filter:brightness(6)}65%{transform:scale(1,1.03);filter:brightness(2.4)}100%{transform:none;filter:none}}
.win.pulse{animation:pls .3s ease-out}
@keyframes pls{0%{filter:brightness(2.4) contrast(1.3)}100%{filter:none}}
.off{position:fixed;inset:0;background:#000;z-index:80}
.off[hidden]{display:none}
.win.crtoff{animation:crt .7s cubic-bezier(.7,0,.3,1) forwards}
@keyframes crt{0%{transform:scale(1,1);filter:brightness(1)}55%{transform:scale(1,.012);filter:brightness(3)}100%{transform:scale(0,.012);filter:brightness(6);opacity:0}}
@media (max-width:520px){.host{display:none}.lk{grid-template-columns:4ch 10ch minmax(0,1fr)}.ttl{display:none}.tb{justify-content:space-between}}
@media (prefers-reduced-motion:reduce){.win::before,.banner::before,.banner::after,.banner .us{animation:none!important}body.hacking .win{animation:none!important}.feed .big{animation:none!important}}
</style>

</head>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var esc=function(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var fine=window.matchMedia&&window.matchMedia('(pointer:fine)').matches;
  var rnd=function(a,b){return a+Math.random()*(b-a)};

  var LINKS=[
    {n:'tiktok',h:'@diogo.611',u:'https://www.tiktok.com/@diogo.611',al:['tt']},
    {n:'twitch',h:'diesereinetyp187',u:'https://www.twitch.tv/diesereinetyp187',al:['tv']},
    {n:'discord',h:'a.guy.named.diogo',copy:'a.guy.named.diogo',al:['dc']},
    {n:'x',h:'@vortex_x09',u:'https://x.com/vortex_x09',al:['twitter']},
    {n:'instagram',h:'@d_mor06',u:'https://www.instagram.com/d_mor06',al:['ig','insta']},
    {n:'github',h:'Diogo175',u:'https://github.com/Diogo175',al:['gh','git']}
  ];
  var GAMES=[
    {n:'snake',h:'classic',f:function(){snake()},al:[]},
    {n:'pong',h:'vs computer',f:function(){pong()},al:[]},
    {n:'2048',h:'slide and merge',f:function(){g2048()},al:['merge']},
    {n:'type',h:'typing speed test',f:function(){typer()},al:['typing','typer','wpm']}
  ];

  /* ================= audio ================= */
  var AC=null,master=null,noiseBuf=null,soundOn=true;
  function unlock(){
    if(AC){if(AC.state==='suspended')AC.resume();return}
    try{
      AC=new (window.AudioContext||window.webkitAudioContext)();
      master=AC.createGain();master.gain.value=.22;master.connect(AC.destination);
      noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
      var d=noiseBuf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      AC.onstatechange=updUI;updUI();
      if(AC.state==='suspended'){try{var rp=AC.resume();if(rp&&rp.catch)rp.catch(function(){})}catch(e2){}}
    }catch(e){AC=null}
  }
  function tone(f,dur,type,vol,when,slideTo){
    if(!AC||!soundOn||AC.state!=='running')return;
    var t=AC.currentTime+(when||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
    g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.03);
  }
  function noise(dur,vol,freq,when,q){
    if(!AC||!soundOn||AC.state!=='running')return;
    var t=AC.currentTime+(when||0),s=AC.createBufferSource();s.buffer=noiseBuf;
    var f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=freq||2000;f.Q.value=q||1;
    var g=AC.createGain();g.gain.setValueAtTime(vol||.3,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*.5,dur+.02);
  }
  var SFX={
    key:function(){noise(.025,.25,rnd(1500,3000),0,3);tone(rnd(900,1200),.02,'square',.04)},
    del:function(){tone(rnd(200,400),.05,'square',.1)},
    enter:function(){noise(.05,.35,700,0,2);tone(160,.08,'square',.12)},
    ok:function(){[660,880,1320].forEach(function(f,i){tone(f,.12,'square',.14,i*.07)})},
    err:function(){tone(140,.28,'sawtooth',.22,0,70);tone(110,.28,'square',.12,.02)},
    launch:function(){tone(300,.4,'sawtooth',.14,0,1800);noise(.25,.2,3000,.1)},
    blip:function(){tone(rnd(700,2100),rnd(.04,.09),Math.random()<.5?'square':'sawtooth',.1)},
    glitch:function(){noise(rnd(.06,.16),.35,rnd(300,4300),0,.7)},
    modem:function(){for(var i=0;i<12;i++)tone(rnd(400,2600),.06,'sine',.12,i*.06)},
    granted:function(){[523,659,784,1047].forEach(function(f,i){tone(f,.18,'square',.16,i*.09)});tone(1047,.5,'triangle',.18,.4)},
    off:function(){tone(1200,.5,'sawtooth',.14,0,40);noise(.3,.2,6000)},
    on:function(){tone(80,.3,'sawtooth',.1,0,600);noise(.15,.15,5000)},
    boot:function(){tone(880,.08,'square',.1);tone(1320,.1,'square',.1,.12)},
    thump:function(){tone(60,.5,'sine',.5,0,32);noise(.14,.3,220)},
    scr:function(){tone(rnd(300,1800),.03,'square',.05)}
  };

  /* ================= state + ui ================= */
  var found={},TOTAL=9;
    var log=$('log'),inp=$('in'),prompt=$('prompt'),busy=false,booting=false;
  function nEggs(){return Object.keys(found).length}
  function updUI(){
    $('sb').textContent='secrets '+nEggs()+'/'+TOTAL;
    $('snd').textContent=(!AC||AC.state!=='running')?'sound: tap to enable':(soundOn?'sound: on':'sound: off');
  }
  function print(html,cls){var d=document.createElement('div');d.className='ln'+(cls?' '+cls:'');d.innerHTML=html;log.appendChild(d);window.scrollTo(0,document.body.scrollHeight);return d}
  function egg(id){
    if(found[id])return;found[id]=1;
        updUI();
    setTimeout(function(){print('[secret unlocked '+nEggs()+'/'+TOTAL+']','amb');SFX.ok();if(nEggs()===TOTAL)setTimeout(function(){print('all secrets found. you are him.','amb');SFX.granted()},700)},350);
  }
  $('snd').addEventListener('click',function(){if(!AC||AC.state!=='running'){unlock();soundOn=true}else soundOn=!soundOn;updUI();if(soundOn)SFX.ok()});
  ['keydown','pointerdown','pointerup','touchend','click'].forEach(function(ev){document.addEventListener(ev,function(e){if(e.target&&e.target.closest&&e.target.closest('#snd'))return;unlock()},true)});

  /* ================= links ================= */
  var PS='<span class="ps1">someone@hub:~$</span> ';
  function linkHtml(l,i){return '<span class="num">['+(i+1)+']</span><span>'+l.n+'</span><span class="hd">'+esc(l.h)+(l.copy?'  (copy)':'')+'</span>'}
  function gameHtml(q,i){return '<span class="num">['+(LINKS.length+i+1)+']</span><span>'+q.n+'</span><span class="hd">'+q.h+'</span>'}
  function printList(){
    LINKS.forEach(function(l,i){
      var d=print(linkHtml(l,i),'lk');
      d.setAttribute('data-i',i);
    });
    print('');print('GAMES &nbsp;<span class="dim">type the number to play</span>','hdr');
    GAMES.forEach(function(q,i){
      var d=print(gameHtml(q,i),'lk');
      d.setAttribute('data-g',i);
    });
  }
  log.addEventListener('click',function(e){var t=e.target.closest&&e.target.closest('.lk');if(!t||busy)return;var gi=t.getAttribute('data-g');if(gi!==null)startGame(+gi);else openLink(+t.getAttribute('data-i'))});
  function openLink(i){openObj(LINKS[i])}
  function openObj(l){
    if(l.copy){
      var ok=function(){print('copied <b>'+esc(l.copy)+'</b> to clipboard. add me on discord.','dim');SFX.ok()};
      var fb=function(){print('discord: <b>'+esc(l.copy)+'</b>','dim');SFX.ok()};
      try{navigator.clipboard.writeText(l.copy).then(ok,fb)}catch(e){fb()}
      return;
    }
    SFX.launch();print('connecting to <b>'+l.n+'</b> ...','dim');
    setTimeout(function(){
      var a=document.createElement('a');a.href=l.u;a.target='_blank';a.rel='noopener noreferrer';document.body.appendChild(a);a.click();a.remove();
      print('connection open. nothing happened? <a href="'+l.u+'" target="_blank" rel="noopener noreferrer">click here</a>','dim');
    },450);
  }
  function findLink(c){
    if(/^\d+$/.test(c)){var n=+c;return n>=1&&n<=LINKS.length?n-1:-1}
    for(var i=0;i<LINKS.length;i++){var l=LINKS[i];if(l.n===c||l.h.toLowerCase()===c||l.al.indexOf(c)>-1)return i}
    return -1;
  }
  function findGame(c){
    if(/^\d+$/.test(c)){var m=+c-LINKS.length-1;return m>=0&&m<GAMES.length?m:-1}
    for(var i=0;i<GAMES.length;i++){var q=GAMES[i];if(q.n===c||q.al.indexOf(c)>-1)return i}
    return -1;
  }

    var b=[],score=0,best=0,over=false;
    function empty(){var e=[];for(var r=0;r<N;r++)for(var c=0;c<N;c++)if(!b[r][c])e.push([r,c]);return e}
    function spawn(){var e=empty();if(!e.length)return;var p=e[Math.floor(Math.random()*e.length)];b[p[0]][p[1]]=Math.random()<.9?2:4}
    function canMove(){for(var r=0;r<N;r++)for(var c=0;c<N;c++){var v=b[r][c];if((c<N-1&&b[r][c+1]===v)||(r<N-1&&b[r+1][c]===v))return true}return false}
    function upd(){g.score('score '+score+' | best '+Math.max(best,score));g.res='2048: best '+Math.max(best,score)}
    function reset(){b=[];for(var r=0;r<N;r++)b.push([0,0,0,0]);score=0;over=false;spawn();spawn();g.msg('swipe or use arrow keys. reach 512 for a secret');draw();upd()}
    function slide(row){
      var a=row.filter(Boolean),gain=0;
      for(var i=0;i<a.length-1;i++){if(a[i]===a[i+1]){a[i]*=2;gain+=a[i];a.splice(i+1,1)}}
      while(a.length<N)a.push(0);
      return{row:a,gain:gain};
    }
    function move(dir){
      if(over)return;
      var moved=false,gain=0,nb=[],r,c,i,j;
      for(r=0;r<N;r++)nb.push(b[r].slice());
      for(i=0;i<N;i++){
        var line=[];
        for(j=0;j<N;j++)line.push(dir===0?b[i][j]:dir===1?b[i][N-1-j]:dir===2?b[j][i]:b[N-1-j][i]);
        var s2=slide(line);gain+=s2.gain;
        for(j=0;j<N;j++){var v=s2.row[j];if(dir===0)nb[i][j]=v;else if(dir===1)nb[i][N-1-j]=v;else if(dir===2)nb[j][i]=v;else nb[N-1-j][i]=v}
      }
      for(r=0;r<N;r++)for(c=0;c<N;c++)if(nb[r][c]!==b[r][c])moved=true;
      if(!moved)return;
      b=nb;score+=gain;spawn();tone(300+Math.min(gain,600),.05,'square',.1);
      var mx=0;for(r=0;r<N;r++)for(c=0;c<N;c++)mx=Math.max(mx,b[r][c]);
      if(mx>=512)egg('2048');
      if(!empty().length&&!canMove()){over=true;best=Math.max(best,score);SFX.err();g.msg('game over. tap or press space to play again')}
      draw();upd();
    }
    function draw(){
      x.fillStyle='#020a04';x.fillRect(0,0,W,W);
      for(var r=0;r<N;r++)for(var c=0;c<N;c++){
        var v=b[r][c],tx=gap+c*(cs+gap),ty=gap+r*(cs+gap);
        x.fillStyle=v?'rgba(57,255,122,'+(0.12+Math.min(.85,Math.log(v)/Math.LN2*.075))+')':'rgba(57,255,122,.05)';
        x.fillRect(tx,ty,cs,cs);
        if(v){x.fillStyle=v>=64?'#021006':'#9dffbf';x.font='700 '+Math.floor(cs*(v<100?.42:v<1000?.34:.27))+'px monospace';x.textAlign='center';x.textBaseline='middle';x.fillText(String(v),tx+cs/2,ty+cs/2+2)}
      }
      if(over){x.fillStyle='rgba(2,10,4,.7)';x.fillRect(0,0,W,W);x.fillStyle='#ff4d5e';x.font='700 '+Math.floor(W/9)+'px monospace';x.textAlign='center';x.textBaseline='middle';x.fillText('GAME OVER',W/2,W/2)}
    }
    var KM={ArrowLeft:0,ArrowRight:1,ArrowUp:2,ArrowDown:3,a:0,d:1,w:2,s:3};
    g.key=function(k){
      if(over&&(k===' '||k==='Enter')){reset();return true}
      if(Object.prototype.hasOwnProperty.call(KM,k)){move(KM[k]);return true}
      return false;
    };
    g.swipe=function(dx,dy){
      if(Math.abs(dx)<28&&Math.abs(dy)<28){if(over)reset();return}
      if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:0);else move(dy>0?3:2);
    };
    g.tap=function(){if(over)reset()};
    reset();
  }

  function typer(){
    var g=gshell('TYPE','type the words, press space after each one',1,1);
    g.cv.style.display='none';g.typing=true;
    var WL=['stream','chat','clip','game','pixel','lag','level','boss','loot','quest','spawn','combo','frag','rank','patch','server','code','build','debug','shell','byte','link','login','boot','sudo','root','kernel','proxy','cache','script','linux','mouse','input','score','respawn','arcade','terminal','keyboard','monitor','online'];
    var box=document.createElement('div');box.className='tbox';
    var ti=document.createElement('input');ti.className='tin';ti.type='text';ti.autocomplete='off';ti.autocapitalize='none';ti.spellcheck=false;ti.setAttribute('autocorrect','off');ti.setAttribute('aria-label','type the words here');
    var mg=g.ov.querySelector('#gmsg');g.ov.insertBefore(box,mg);g.ov.insertBefore(ti,mg);
    var words=[],idx=0,res=[],t0=0,done=false;
    function render(){box.innerHTML=words.map(function(w,i){var c=i<idx?(res[i]?'ok':'bad'):(i===idx?'cur2':'');return '<span class="tw '+c+'">'+w+'</span>'}).join(' ')}
    function stats(){
      var chars=0,ok=0;for(var i=0;i<idx;i++){if(res[i]){chars+=words[i].length+1;ok++}}
      var mins=Math.max(.0001,(Date.now()-t0)/60000);
      return{wpm:Math.round(chars/5/mins),acc:idx?Math.round(ok/idx*100):100};
    }
    function start(){
      words=[];for(var i=0;i<12;i++)words.push(WL[Math.floor(Math.random()*WL.length)]);
      idx=0;res=[];t0=0;done=false;ti.value='';ti.disabled=false;g.score('0 wpm');g.msg('type the words, press space after each one');render();ti.focus();
    }
    function finish(){
      done=true;var st=stats();g.score(st.wpm+' wpm');g.res='type: '+st.wpm+' wpm, '+st.acc+'% accurate';
      g.msg(st.wpm+' wpm, '+st.acc+'% accurate. tap the words or press enter to play again');
      if(st.wpm>=35&&st.acc>=90)egg('typer');SFX.granted();ti.blur();ti.disabled=true;render();
    }
    ti.addEventListener('input',function(){
      if(done)return;
      if(!t0)t0=Date.now();
      var v=ti.value,last=(idx===words.length-1);
      if(/\s$/.test(v)||(last&&v.trim()===words[idx])){
        res[idx]=(v.trim()===words[idx]);idx++;ti.value='';SFX.key();
        if(idx>=words.length)return finish();
        render();g.score(stats().wpm+' wpm');
      }
    });
    box.addEventListener('click',function(){if(done)start();else ti.focus()});
    g.key=function(k){if(done&&k==='Enter'){start();return true}return false};
    g.stop=function(){};
    start();
  }

  /* ================= boot ================= */
  var Q=[],QT=null,cur=null,skipping=false,started=false,againFlag=false;
  var CHARS='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#@%&$';
  function setHint(t){var h=$('hint');if(h)h.textContent=t}
  function later(ms,fn){
    var t=setTimeout(function(){cur=null;fn()},ms);
    cur={finish:function(){clearTimeout(t);cur=null;fn()}};
  }
  function anim(total,tick,fin,next){
    var t0=performance.now(),iv=setInterval(function(){
      var p=Math.min(1,(performance.now()-t0)/total);tick(p);
      if(p>=1){clearInterval(iv);cur=null;fin();next()}
    },45);
    cur={finish:function(){clearInterval(iv);cur=null;fin();next()}};
  }
  function step(d,fn,intro){Q.push({d:d,intro:!!intro,f:function(next,fast){fn(fast);next()}})}
  function astep(d,intro,total,mk){
    Q.push({d:d,intro:!!intro,f:function(next,fast){var o=mk();if(fast){o.fin();next()}else anim(total,o.tick,o.fin,next)}});
  }
  function runQ(){
    if(!Q.length){endBoot();return}
    if(skipping){var st=Q.shift();if(st.intro)runQ();else st.f(runQ,true);return}
    var nx=Q[0];
    QT=setTimeout(function(){Q.shift();nx.f(runQ,false)},nx.d);
  }
  function skipBoot(){
    if(!booting||skipping)return;
    skipping=true;
    if(cur)cur.finish();else{clearTimeout(QT);runQ()}
  }
  function endBoot(){
    booting=false;cur=null;setHint('type a number, hit enter');
    prompt.hidden=false;if(fine||againFlag)inp.focus();if(againFlag)egg('exit');ghost();
    window.scrollTo(0,document.body.scrollHeight);

    astep(60,true,800,function(){
